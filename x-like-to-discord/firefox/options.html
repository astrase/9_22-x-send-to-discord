<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X → Discord 設定</title><link rel="stylesheet" href="options.css"></head>
<body><main><header><h1>X → Discord</h1><label class="theme-control"><span id="theme-label">ライトモード</span><input id="theme" type="checkbox" role="switch" aria-label="ダークモード"><span class="switch-track" aria-hidden="true"></span></label></header><p>いいねした投稿のURLを、指定したDiscordチャンネルへ送ります。</p>

<form id="form"><label for="webhook">Discord Webhook URL</label><input id="webhook" type="password" autocomplete="off" spellcheck="false" placeholder="https://discord.com/api/webhooks/…"><p class="hint">秘密のURLです。他人に見せないでください。空欄で保存すると削除します。</p>
<label class="check"><input id="use-fixup" type="checkbox">Discordへ送るリンクをFixup形式に変換する</label><p class="hint">ON：fixupx.com ／ OFF：x.com。変更後は「保存」を押してください。</p>
<label for="hours">同じ投稿の再送を防ぐ時間</label><input id="hours" type="number" min="1" max="8760" step="1" value="24" required><p class="hint">単位：時間（1〜8760）。初期値は24時間です。</p>
<label class="check"><input id="enabled" type="checkbox">いいねした投稿URLをDiscordに自動送信する</label><p class="hint">送信先チャンネルの参加者に、いいねした投稿とその操作が分かります。有効にする場合はチェックして保存してください。</p>
<div class="buttons"><button type="submit">保存</button><button type="button" id="test">Discord接続テスト</button></div><p class="hint">テストには保存済みのURLを使います。</p></form><p id="status" role="status" aria-live="polite"></p></main><script src="options.js"></script></body></html>
